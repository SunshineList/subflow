name: Build and Release Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/subflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: |
          cd webs
          pnpm install

      - name: Build frontend
        run: |
          cd webs
          pnpm run build

      - name: Copy frontend to static
        run: |
          rm -rf static
          mkdir -p static
          cp -r webs/dist/* static/

      - name: Build Go binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -tags=prod -ldflags="-s -w" -o build/subflow-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags=prod -ldflags="-s -w" -o build/subflow-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -tags=prod -ldflags="-s -w" -o build/subflow-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -tags=prod -ldflags="-s -w" -o build/subflow-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -tags=prod -ldflags="-s -w" -o build/subflow-darwin-arm64 .

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "## 🎉 首次发布" > changelog.md
            echo "" >> changelog.md
            echo "### 📝 所有提交:" >> changelog.md
            git log --pretty=format:"- %s (%h)" >> changelog.md
          else
            echo "## 🚀 更新内容 ($PREVIOUS_TAG -> $CURRENT_TAG)" > changelog.md
            echo "" >> changelog.md
            echo "### 📝 提交记录:" >> changelog.md
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..$CURRENT_TAG >> changelog.md
          fi

          echo "" >> changelog.md
          echo "### Release Files:" >> changelog.md
          echo "- \`subflow-linux-amd64\` - Linux x64" >> changelog.md
          echo "- \`subflow-linux-arm64\` - Linux ARM64" >> changelog.md
          echo "- \`subflow-windows-amd64.exe\` - Windows x64" >> changelog.md
          echo "- \`subflow-darwin-amd64\` - macOS x64" >> changelog.md
          echo "- \`subflow-darwin-arm64\` - macOS ARM64 (Apple Silicon)" >> changelog.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker_tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tags=${IMAGE}:dev-${SHORT_SHA},${IMAGE}:dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.changelog.outputs.current_tag }}
          name: Release ${{ steps.changelog.outputs.current_tag }}
          body_path: changelog.md
          files: |
            build/subflow-linux-amd64
            build/subflow-linux-arm64
            build/subflow-windows-amd64.exe
            build/subflow-darwin-amd64
            build/subflow-darwin-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
